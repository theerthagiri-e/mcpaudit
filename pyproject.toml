[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpaudit-aerovant"
version = "0.2.0"
description = "Static triage for MCP server security posture: exposed/unauthenticated transports, exec sinks, weak auth defaults."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Theerthagiri E" }]
keywords = ["mcp", "model-context-protocol", "security", "ssrf", "authentication", "ai-agents"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcpaudit = "mcpaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
